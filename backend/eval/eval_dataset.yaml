- id: 14
  category: adversarial
  question: "What are the specific signs of overfitting in a neural network, and how would you address it according to this book?"
  ground_truth: "A common sign is when the network is complex enough to fit the training data very well but generalization suffers. The book's fix: a common approach is to first create a network large enough to overfit (confirming the task is learnable), then EITHER shrink the network OR increase alpha to add regularization (an l2 penalty on the MLPClassifier's weights, similar to ridge regression) to improve generalization performance."
  expected_source_pages: [125, 131]
  scoring_note: "FAIL if the answer mentions max_depth, pre-pruning, or learning-rate as the fix - those are gradient-boosted-tree concepts from a different section and do not apply to MLPClassifier. This is the specific regression case for the cross-topic blending bug found during manual testing."

- id: 15
  category: adversarial
  question: "How do you tune the number of hidden layers in a Random Forest?"
  ground_truth: "Random forests do not have hidden layers - that is a neural network (MLPClassifier) concept. Random forests are tuned via n_estimators, max_features, and pre-pruning options like max_depth."
  expected_source_pages: []
  scoring_note: "PASS only if the answer explicitly corrects the false premise (states random forests don't have hidden layers) rather than answering as if the premise were valid."

- id: 16
  category: adversarial
  question: "How does the learning rate parameter affect a Support Vector Machine?"
  ground_truth: "SVMs do not use a learning rate parameter - that's a gradient-based/boosting concept. SVMs are tuned via C (regularization strength, limits the importance of each point) and gamma (controls the width/scale of the Gaussian/RBF kernel)."
  expected_source_pages: [112]
  scoring_note: "PASS only if the answer explicitly corrects the false premise and does not describe an SVM 'learning rate' as if it exists."
